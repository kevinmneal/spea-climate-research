name: Reproduce public snapshot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check_snapshot.py
      - run: python scripts/replay.py --output replay_output
      - run: python -m unittest discover -s tests -p 'test_replay*.py'
  selected-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-components.txt
      - run: python -m pytest tests/components -q
        env:
          PYTHONPATH: src
      - run: python examples/synthetic_components.py
        env:
          PYTHONPATH: src
      - run: python scripts/plot_results.py --output replay_figure.png
