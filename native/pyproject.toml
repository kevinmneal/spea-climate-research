[project]
name = "spea-climate-biogeography"
version = "0.1.0"
description = "Public-data feasibility audit and contemporary Spea climate pilot"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2",
  "matplotlib>=3.10,<4",
  "rasterio>=1.4,<2",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "requests>=2.32,<3",
  "openpyxl>=3.1,<4",
  "pytest>=8,<10",
  "pyshp>=3.1.6",
  "xgboost>=3.2,<4",
  "catboost>=1.2.10",
  "tabm>=0.0.3",
  "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

